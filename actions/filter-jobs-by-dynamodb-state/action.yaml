name: 'Filter Jobs by DynamoDB state'
author: 'Yuya Takeyama'

inputs:
  jobs:
    description: 'Jobs'
  jobs-file:
    description: 'Path to a file containing Jobs JSON'
  dynamodb-table:
    description: 'DynamoDB Table'
    required: true
  dynamodb-region:
    description: 'DynamoDB Region'
    required: true
  running-ttl:
    description: 'TTL for the claim on each kept job, after which another run for the same commit can claim it (format: 1d, 1h, 1m, 1s)'
    default: '1h'

outputs:
  result:
    description: 'Filtered Jobs'
  result-file:
    description: 'Path to a file containing filtered Jobs JSON'

runs:
  using: 'node24'
  main: 'dist/index.js'
