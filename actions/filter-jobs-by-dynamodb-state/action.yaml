name: 'Filter Jobs by DynamoDB state'
author: 'Yuya Takeyama'

inputs:
  jobs:
    description: 'Jobs'
  jobs-file:
    description: 'Path to a file containing Jobs JSON'
  dynamodb-table:
    description: 'DynamoDB Table'
    required: true
  dynamodb-region:
    description: 'DynamoDB Region'
    required: true
  claim-ttl:
    description: 'TTL for the claim on each kept job. It only needs to cover the time from this step until the build job reaches set-dynamodb-state-to-running (format: 1d, 1h, 1m, 1s)'
    default: '15m'

outputs:
  result:
    description: 'Filtered Jobs'
  result-file:
    description: 'Path to a file containing filtered Jobs JSON'

runs:
  using: 'node24'
  main: 'dist/index.js'
